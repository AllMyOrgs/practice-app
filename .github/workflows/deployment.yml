name: Deployment Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  # ────────────────────────────────────────────────────────────────────
  # STAGE 1 — DEV (auto, no approval)
  # ────────────────────────────────────────────────────────────────────
  dev-backend:
    name: "[DEV] Deploy Backend"
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull
        run: vercel pull --yes --cwd backend --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID_DEV }}
      - name: Build
        run: vercel build --cwd backend --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID_DEV }}
      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --cwd backend --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID_DEV }}
      - name: Summary
        run: echo "**[DEV] Backend** → ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY

  dev-frontend:
    name: "[DEV] Deploy Frontend"
    runs-on: ubuntu-latest
    needs: dev-backend
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull
        run: vercel pull --yes --cwd frontend --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID_DEV }}
      - name: Build
        run: vercel build --cwd frontend --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID_DEV }}
          VITE_API_URL: ${{ secrets.VITE_API_URL_DEV }}
      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --cwd frontend --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID_DEV }}
      - name: Summary
        run: echo "**[DEV] Frontend** → ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────────────
  # STAGE 2 — QA (requires approval)
  # ────────────────────────────────────────────────────────────────────
  qa-approval:
    name: "[QA] Awaiting Approval"
    runs-on: ubuntu-latest
    needs: dev-frontend
    environment: qa          # pauses here — notifies reviewers configured in GitHub → Settings → Environments → qa
    steps:
      - run: echo "QA deployment approved"

  qa-backend:
    name: "[QA] Deploy Backend"
    runs-on: ubuntu-latest
    needs: qa-approval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull
        run: vercel pull --yes --cwd backend --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID_QA }}
      - name: Build
        run: vercel build --cwd backend --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID_QA }}
      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --cwd backend --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID_QA }}
      - name: Summary
        run: echo "**[QA] Backend** → ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY

  qa-frontend:
    name: "[QA] Deploy Frontend"
    runs-on: ubuntu-latest
    needs: qa-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull
        run: vercel pull --yes --cwd frontend --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID_QA }}
      - name: Build
        run: vercel build --cwd frontend --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID_QA }}
          VITE_API_URL: ${{ secrets.VITE_API_URL_QA }}
      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --cwd frontend --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID_QA }}
      - name: Summary
        run: echo "**[QA] Frontend** → ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────────────
  # STAGE 3 — STG (requires approval)
  # ────────────────────────────────────────────────────────────────────
  stg-approval:
    name: "[STG] Awaiting Approval"
    runs-on: ubuntu-latest
    needs: qa-frontend
    environment: stg         # pauses here — notifies reviewers configured in GitHub → Settings → Environments → stg
    steps:
      - run: echo "STG deployment approved"

  stg-backend:
    name: "[STG] Deploy Backend"
    runs-on: ubuntu-latest
    needs: stg-approval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull
        run: vercel pull --yes --cwd backend --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID_STG }}
      - name: Build
        run: vercel build --cwd backend --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID_STG }}
      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --cwd backend --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID_STG }}
      - name: Summary
        run: echo "**[STG] Backend** → ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY

  stg-frontend:
    name: "[STG] Deploy Frontend"
    runs-on: ubuntu-latest
    needs: stg-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull
        run: vercel pull --yes --cwd frontend --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID_STG }}
      - name: Build
        run: vercel build --cwd frontend --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID_STG }}
          VITE_API_URL: ${{ secrets.VITE_API_URL_STG }}
      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --cwd frontend --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID_STG }}
      - name: Summary
        run: echo "**[STG] Frontend** → ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────────────
  # STAGE 4 — PROD (requires approval)
  # ────────────────────────────────────────────────────────────────────
  prod-approval:
    name: "[PROD] Awaiting Approval"
    runs-on: ubuntu-latest
    needs: stg-frontend
    environment: prod        # pauses here — notifies reviewers configured in GitHub → Settings → Environments → prod
    steps:
      - run: echo "PROD deployment approved"

  prod-backend:
    name: "[PROD] Deploy Backend"
    runs-on: ubuntu-latest
    needs: prod-approval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull
        run: vercel pull --yes --cwd backend --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID_PROD }}
      - name: Build
        run: vercel build --prod --cwd backend --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID_PROD }}
      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --cwd backend --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID_PROD }}
      - name: Summary
        run: echo "**[PROD] Backend** → ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY

  prod-frontend:
    name: "[PROD] Deploy Frontend"
    runs-on: ubuntu-latest
    needs: prod-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull
        run: vercel pull --yes --cwd frontend --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID_PROD }}
      - name: Build
        run: vercel build --prod --cwd frontend --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID_PROD }}
          VITE_API_URL: ${{ secrets.VITE_API_URL_PROD }}
      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --cwd frontend --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID_PROD }}
      - name: Summary
        run: echo "**[PROD] Frontend** → ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
