name: Deploy — DEV

# Auto-deploys on every push to dev. No approval gate.

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  deploy-backend:
    name: Backend → DEV
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --cwd backend --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID_DEV }}

      - name: Build
        run: vercel build --cwd backend --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID_DEV }}

      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --cwd backend --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID_DEV }}

      - name: Summary
        run: echo "### Backend DEV → ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY

  deploy-frontend:
    name: Frontend → DEV
    runs-on: ubuntu-latest
    needs: deploy-backend
    environment: dev

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --cwd frontend --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID_DEV }}

      - name: Build
        run: vercel build --cwd frontend --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID_DEV }}
          VITE_API_URL: ${{ secrets.VITE_API_URL_DEV }}

      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --cwd frontend --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID_DEV }}

      - name: Summary
        run: echo "### Frontend DEV → ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
